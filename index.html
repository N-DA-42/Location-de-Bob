<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Bob</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Styles personnalisés minimes en plus de Tailwind */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F9FAF9;
      color: #2d3a2c;
    }
  </style>
</head>
<body>

  <div class="min-h-screen">
    <!-- Navigation Minimaliste -->
    <nav class="border-b border-gray-100 bg-white/80 backdrop-blur-md sticky top-0 z-10">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="text-2xl font-bold tracking-tight flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-[#8ba888] flex items-center justify-center text-white text-lg">B</span>
          BOB.
        </div>
        <div class="text-sm font-medium text-gray-500">Planning partagé</div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
      <!-- Section Héro -->
      <div class="flex flex-col md:flex-row gap-12 items-center mb-16">
        <div class="flex-1 space-y-6">
          <h1 class="text-5xl font-extrabold tracking-tight text-[#1a2319] leading-tight">
            Prenez la route, <br/>sans vous prendre <span class="text-[#8ba888]">la tête.</span>
          </h1>
          <p class="text-lg text-gray-600 max-w-md leading-relaxed">
            Vérifiez les disponibilités de Bob, choisissez vos options et réservez vos dates en quelques clics. 
          </p>
        </div>
        <div class="flex-1 w-full">
          <div class="relative rounded-3xl overflow-hidden shadow-2xl aspect-[4/3] bg-gray-200">
            <img 
              src="peugeot-boxer-peugeot-boxer-vert_9585905656.jpg" 
              alt="Bob le Van" 
              class="object-cover w-full h-full hover:scale-105 transition-transform duration-700"
              onerror="this.onerror=null; this.src='https://placehold.co/800x600/8ba888/ffffff?text=Bob+Le+Van';"
            />
          </div>
        </div>
      </div>

      <!-- Section Interface de réservation -->
      <div class="bg-white rounded-[2rem] shadow-xl shadow-gray-200/50 p-8 md:p-12 border border-gray-50">
        <div class="flex items-center gap-4 mb-10">
          <div class="p-3 bg-[#f2f6f2] rounded-2xl text-[#8ba888]">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          </div>
          <h2 class="text-3xl font-bold text-[#1a2319]">Organiser un séjour</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
          
          <!-- Colonne Gauche : Calendrier -->
          <div class="space-y-6">
            <div class="flex items-center justify-between mb-6 bg-[#f9faf9] p-2 rounded-2xl">
              <button id="btn-prev-month" class="p-3 hover:bg-white rounded-xl transition-colors shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <h3 id="month-title" class="text-lg font-bold w-48 text-center"></h3>
              <button id="btn-next-month" class="p-3 hover:bg-white rounded-xl transition-colors shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
            
            <div id="calendar-grid" class="grid grid-cols-7 gap-y-4 gap-x-2 text-center">
              <!-- Les jours et cases du calendrier seront générés par JavaScript ici -->
            </div>

            <!-- Légende minimaliste -->
            <div class="flex gap-4 mt-8 text-sm text-gray-500 justify-center">
              <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-50 border border-red-100"></div> Indisponible</span>
              <span class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#8ba888]"></div> Sélection</span>
            </div>
          </div>

          <!-- Colonne Droite : Options & Formulaire -->
          <div class="flex flex-col h-full space-y-10">
            
            <!-- Options -->
            <div class="space-y-4">
              <h3 class="text-sm font-semibold uppercase tracking-widest text-gray-400 mb-4">Équipements optionnels</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                
                <!-- Option Glacière -->
                <label id="label-cooler" class="relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all border-gray-100 hover:border-gray-200 text-gray-500">
                  <input type="checkbox" id="opt-cooler" class="sr-only">
                  <span class="font-medium">Glacière</span>
                  <div id="check-cooler" class="hidden absolute top-2 right-2 text-[#8ba888]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                </label>

                <!-- Option Douche -->
                <label id="label-shower" class="relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all border-gray-100 hover:border-gray-200 text-gray-500">
                  <input type="checkbox" id="opt-shower" class="sr-only">
                  <span class="font-medium">Douche</span>
                  <div id="check-shower" class="hidden absolute top-2 right-2 text-[#8ba888]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                </label>

                <!-- Option Lit -->
                <label id="label-bed" class="relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all border-gray-100 hover:border-gray-200 text-gray-500">
                  <input type="checkbox" id="opt-bed" class="sr-only">
                  <span class="font-medium">3e lit</span>
                  <div id="check-bed" class="hidden absolute top-2 right-2 text-[#8ba888]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                </label>

              </div>
            </div>

            <!-- Validation -->
            <div class="bg-[#f9faf9] p-6 rounded-3xl mt-auto">
              
              <!-- Vue Succès -->
              <div id="success-view" class="hidden text-center space-y-4 py-4">
                <div class="w-16 h-16 bg-[#8ba888] rounded-full flex items-center justify-center mx-auto text-white shadow-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <p id="success-text" class="font-semibold text-lg"></p>
                <button id="btn-new-booking" class="text-sm text-[#8ba888] font-medium hover:underline">
                  Faire une nouvelle réservation
                </button>
              </div>

              <!-- Vue Formulaire -->
              <div id="form-view" class="space-y-6">
                <div>
                  <label class="block text-sm font-semibold uppercase tracking-widest text-gray-400 mb-2">Qui réserve ?</label>
                  <input 
                    type="text" 
                    id="input-name"
                    placeholder="Votre prénom..."
                    class="w-full px-5 py-4 rounded-xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-[#8ba888] bg-white outline-none transition-all placeholder:text-gray-300 font-medium"
                  />
                </div>

                <p id="error-message" class="hidden text-red-500 text-sm font-medium"></p>

                <button id="btn-book" class="w-full bg-[#2d3a2c] hover:bg-[#1a2319] text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-gray-900/10 transition-all hover:-translate-y-0.5 active:translate-y-0 flex justify-between items-center px-6">
                  <span>Réserver Bob</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>

                <!-- Résumé textuel -->
                <p id="selection-summary" class="text-xs text-center text-gray-400 font-medium h-4"></p>
              </div>

            </div>

          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Configuration Cloud Partagée ---
    // POUR GITHUB : Remplacez cet objet de configuration par les identifiants 
    // de votre propre projet Firebase (disponible dans la console Firebase).
    const defaultFirebaseConfig = {
      // apiKey: "VOTRE_API_KEY",
      // authDomain: "votre-projet.firebaseapp.com",
      // projectId: "votre-projet",
      // storageBucket: "votre-projet.appspot.com",
      // messagingSenderId: "xxx",
      // appId: "xxx"
    };

    const firebaseConfig = typeof window.__firebase_config !== 'undefined' 
      ? JSON.parse(window.__firebase_config) 
      : defaultFirebaseConfig;

    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'bob-github-deploy';

    let app, auth, db;
    // Initialisation sécurisée (évite de planter si la config est vide sur Github au début)
    try {
      if (Object.keys(firebaseConfig).length > 0) {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      }
    } catch(e) { console.error("Firebase n'est pas configuré."); }

    // --- État Global de l'Application ---
    const state = {
      user: null,
      currentMonth: new Date(),
      selection: { start: null, end: null },
      options: { cooler: false, shower: false, bed: false },
      userName: '',
      successMessage: '',
      errorMsg: '',
      bookings: []
    };

    const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    const dayNames = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

    // --- Utilitaires de dates ---
    const normalizeDate = (date) => {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      return d;
    };

    const isSameDay = (d1, d2) => {
      if (!d1 || !d2) return false;
      return normalizeDate(d1).getTime() === normalizeDate(d2).getTime();
    };

    const isDateBetween = (date, start, end) => {
      if (!start || !end) return false;
      const t = normalizeDate(date).getTime();
      return t > normalizeDate(start).getTime() && t < normalizeDate(end).getTime();
    };

    // --- Vérifications de disponibilité ---
    const isDateBooked = (date) => {
      const dTime = normalizeDate(date).getTime();
      return state.bookings.some(b => {
        return dTime >= normalizeDate(b.start).getTime() && dTime <= normalizeDate(b.end).getTime();
      });
    };

    const hasBookingBetween = (start, end) => {
      const s = normalizeDate(start).getTime();
      const e = normalizeDate(end).getTime();
      return state.bookings.some(b => {
        const bStart = normalizeDate(b.start).getTime();
        const bEnd = normalizeDate(b.end).getTime();
        return (bStart <= e && bEnd >= s);
      });
    };

    // --- Mises à jour de l'Interface ---
    const updateUI = () => {
      renderCalendar();
      updateOptionsUI();
      updateFormUI();
    };

    const renderCalendar = () => {
      const year = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      
      document.getElementById('month-title').innerText = `${monthNames[month]} ${year}`;
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = ''; // Nettoyer la grille

      // Ajouter les jours de la semaine
      dayNames.forEach(day => {
        const dayEl = document.createElement('div');
        dayEl.className = "text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2";
        dayEl.innerText = day;
        grid.appendChild(dayEl);
      });

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; 
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = normalizeDate(new Date());

      // Cases vides du début
      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = "h-10 w-10";
        grid.appendChild(empty);
      }

      // Cases des jours
      for (let i = 1; i <= daysInMonth; i++) {
        const date = new Date(year, month, i);
        const isPast = normalizeDate(date).getTime() < today.getTime();
        const booked = isDateBooked(date);
        
        const isStart = isSameDay(date, state.selection.start);
        const isEnd = isSameDay(date, state.selection.end);
        const isBetween = isDateBetween(date, state.selection.start, state.selection.end);
        
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.disabled = isPast || booked;
        
        let baseClasses = "h-10 w-10 flex items-center justify-center text-sm rounded-full transition-all duration-200 ";
        
        if (isPast) {
          baseClasses += "text-gray-300 cursor-not-allowed";
        } else if (booked) {
          baseClasses += "bg-red-50 text-red-300 line-through cursor-not-allowed";
        } else if (isStart || isEnd) {
          baseClasses += "bg-[#8ba888] text-white font-bold shadow-md cursor-pointer scale-110";
        } else if (isBetween) {
          baseClasses += "bg-[#d8e3d7] text-[#2d3a2c] cursor-pointer rounded-none";
        } else {
          baseClasses += "text-gray-700 hover:bg-gray-100 cursor-pointer";
        }
        
        btn.className = baseClasses;
        
        // Ajouter l'événement de clic seulement si le bouton n'est pas désactivé
        if (!btn.disabled) {
          btn.addEventListener('click', () => handleDateClick(date));
        }

        grid.appendChild(btn);
      }
    };

    const updateOptionsUI = () => {
      ['cooler', 'shower', 'bed'].forEach(opt => {
        const label = document.getElementById(`label-${opt}`);
        const check = document.getElementById(`check-${opt}`);
        
        if (state.options[opt]) {
          label.className = "relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all border-[#8ba888] bg-[#f4f7f4] text-[#2d3a2c]";
          check.classList.remove('hidden');
        } else {
          label.className = "relative flex flex-col items-center justify-center p-4 rounded-2xl border-2 cursor-pointer transition-all border-gray-100 hover:border-gray-200 text-gray-500";
          check.classList.add('hidden');
        }
      });
    };

    const updateFormUI = () => {
      const successView = document.getElementById('success-view');
      const formView = document.getElementById('form-view');
      const errorEl = document.getElementById('error-message');
      const summary = document.getElementById('selection-summary');

      if (state.successMessage) {
        successView.classList.remove('hidden');
        formView.classList.add('hidden');
        document.getElementById('success-text').innerText = state.successMessage;
      } else {
        successView.classList.add('hidden');
        formView.classList.remove('hidden');
        
        // Gérer le message d'erreur
        if (state.errorMsg) {
          errorEl.innerText = state.errorMsg;
          errorEl.classList.remove('hidden');
        } else {
          errorEl.classList.add('hidden');
        }

        // Gérer le texte récapitulatif
        if (state.selection.start && !state.selection.end) {
          summary.innerText = "Sélectionnez la date de fin...";
        } else if (state.selection.start && state.selection.end) {
          summary.innerText = `Du ${state.selection.start.toLocaleDateString()} au ${state.selection.end.toLocaleDateString()}`;
        } else {
          summary.innerText = "";
        }
      }
    };

    // --- Actions et Logique Métier ---
    const handleDateClick = (date) => {
      state.errorMsg = '';
      state.successMessage = '';
      const clickedDate = normalizeDate(date);

      if (!state.selection.start || (state.selection.start && state.selection.end)) {
        state.selection = { start: clickedDate, end: null };
      } else {
        if (clickedDate.getTime() <= state.selection.start.getTime()) {
          state.selection = { start: clickedDate, end: null };
        } else {
          if (hasBookingBetween(state.selection.start, clickedDate)) {
            state.errorMsg = "Ces dates chevauchent une réservation existante.";
            state.selection = { start: clickedDate, end: null };
          } else {
            state.selection.end = clickedDate;
          }
        }
      }
      updateUI();
    };

    const handleBooking = async () => {
      if (!state.selection.start || !state.selection.end) {
        state.errorMsg = "Veuillez sélectionner une date de début et de fin.";
        updateUI(); return;
      }
      if (!state.userName.trim()) {
        state.errorMsg = "Veuillez indiquer votre prénom.";
        updateUI(); return;
      }
      if (!state.user && auth) {
        state.errorMsg = "Connexion au planning partagé en cours...";
        updateUI(); return;
      }

      const newBooking = {
        start: state.selection.start.toISOString(),
        end: state.selection.end.toISOString(),
        name: state.userName,
        options: { ...state.options },
        createdAt: new Date().toISOString()
      };

      try {
        if (db) {
          const bookingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
          await addDoc(bookingsRef, newBooking);
        } else {
           // Mode sans Firebase pour la démo / hors ligne
           state.bookings.push({
             id: Math.random().toString(),
             start: new Date(newBooking.start),
             end: new Date(newBooking.end),
             name: newBooking.name,
             options: newBooking.options
           });
        }
        
        state.successMessage = `Super ${state.userName} ! Bob est réservé du ${state.selection.start.toLocaleDateString()} au ${state.selection.end.toLocaleDateString()}.`;
        state.selection = { start: null, end: null };
        state.options = { cooler: false, shower: false, bed: false };
        state.userName = '';
        state.errorMsg = '';
        document.getElementById('input-name').value = '';
        
      } catch (error) {
        console.error("Erreur lors de la réservation:", error);
        state.errorMsg = "Erreur lors de l'enregistrement de la réservation.";
      }
      updateUI();
    };

    // --- Initialisation et Écouteurs d'événements ---
    const initApp = () => {
      // Navigation Mois
      document.getElementById('btn-prev-month').addEventListener('click', () => {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() - 1, 1);
        updateUI();
      });
      document.getElementById('btn-next-month').addEventListener('click', () => {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + 1, 1);
        updateUI();
      });

      // Options
      ['cooler', 'shower', 'bed'].forEach(opt => {
        document.getElementById(`opt-${opt}`).addEventListener('change', (e) => {
          state.options[opt] = e.target.checked;
          updateUI();
        });
      });

      // Inputs et Boutons
      document.getElementById('input-name').addEventListener('input', (e) => {
        state.userName = e.target.value;
      });
      document.getElementById('btn-book').addEventListener('click', handleBooking);
      document.getElementById('btn-new-booking').addEventListener('click', () => {
        state.successMessage = '';
        updateUI();
      });

      // Initialiser Firebase Auth si configuré
      if (auth) {
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) { console.error("Erreur Auth:", e); }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
          state.user = user;
          if (user) {
            const bookingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
            onSnapshot(bookingsRef, (snapshot) => {
              state.bookings = snapshot.docs.map(doc => {
                const data = doc.data();
                return {
                  id: doc.id,
                  start: new Date(data.start),
                  end: new Date(data.end),
                  name: data.name,
                  options: data.options
                };
              });
              updateUI();
            }, (error) => {
              console.error("Erreur de synchronisation:", error);
            });
          }
        });
      } else {
        console.warn("L'application tourne en mode local (sans base de données).");
      }

      // Premier rendu
      updateUI();
    };

    // Démarrer l'application une fois le DOM chargé
    window.addEventListener('DOMContentLoaded', initApp);

  </script>
</body>
</html>
